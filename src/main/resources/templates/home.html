
<!DOCTYPE html>
<html lang="en"
xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img th:src="@{/image/weather-app.png}" alt="" width="30" height="24" class="d-inline-block align-text-top">
            Weather Tracker
        </a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3"th:text ="${user.username}">Username</span>
           <form action = "/logout"method="post"class="m-0">
               <button type="submit"class="btn btn-outline-danger">Sign Out</button>
           </form>
        </div>
    </div>
</nav>

<section id="page-content">
    <div class="container mt-4">
        <form action="/locations/search" method="get" class="d-flex my-4">
            <div class="input-group location-search-input-group me-3">
                <input class="form-control" type="text" name="name" placeholder="Enter location" required>
                <button class="btn btn-outline-secondary btn-sm clear-input-button" type="button"
                        onclick="this.previousElementSibling.value=''">
                    &times;
                </button>
            </div>
            <button type="submit" class="btn btn-outline-success">Search</button>
        </form>

        <div class="row">
            <div class="col-12 col-lg-3 col-md-6 mb-4" th:each="card : ${cards}">
                <div class="card h-100 position-relative weather-card">
                    <div class="position-absolute weather-card-delete-form">
                        <form action="/locations/delete" method="post">
                            <input type="hidden" name="locationId" th:value="${card.location.id}">
                            <button type="submit" class="btn-close" aria-label="Delete"></button>
                        </form>
                    </div>

                    <img class="card-img-top img-fluid"
                         th:src="${card.weatherResultDto.iconPatch}"
                         alt="Weather icon">

                    <div class="card-body d-flex flex-column">
                        <h1 class="card-text">
                            <span th:text="${card.weatherResultDto.temperature}">7</span>°C
                        </h1>

                        <h3 class="card-title" th:text="${card.location.name}">Tbilisi</h3>

                        <p class="card-text mb-1">
                            Feels like <span th:text="${card.weatherResultDto.feelsLike}">2</span>°C.
                            <span th:text="${card.weatherResultDto.description}">Clear sky</span>
                        </p>

                        <p class="card-text mb-1">
                            Humidity: <span th:text="${card.weatherResultDto.humidity}">70</span>%
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
    </div>
</footer>

</body>
</html>
